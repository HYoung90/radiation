<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ expl }} 상세 데이터</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.min.css">
    <style>
        /* 기존 디자인 그대로 유지 */
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 20px auto; background-color: #ffffff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08); }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 30px; font-size: 2.2em; }
        .btn { display: inline-block; padding: 12px 22px; border-radius: 6px; cursor: pointer; text-decoration: none; color: white; border: none; min-width: 120px; text-align: center; }
        .btn-back { background-color: #6c757d; }
        .btn-apply { background-color: #34495e; }
        .btn-clear { background-color: #e0a800; }
        .date-filter-section { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; padding: 20px; background-color: #f7f9fa; border-radius: 8px; }
        input[type="text"] { padding: 10px; border-radius: 5px; border: 1px solid #ced4da; width: 160px; }
        #backupRadiationHistoryTable { width: 100% !important; margin-top: 30px; }
        #backupRadiationHistoryTable thead th { background-color: #6c757d; color: white; padding: 15px; }
        .dataTables_wrapper .dataTables_paginate { margin-top: 20px; text-align: center; }
        .dataTables_wrapper .dataTables_info, .dataTables_wrapper .dataTables_filter, .dataTables_wrapper .dataTables_length { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div style="margin-bottom: 25px;">
            <a href="javascript:history.back()" class="btn btn-back">뒤로가기</a>
        </div>

        <h1>{{ expl }}의 과거 데이터 기록</h1>

        <div class="date-filter-section">
            <label>시작일: </label><input type="text" id="minDate" readonly>
            <label>종료일: </label><input type="text" id="maxDate" readonly>
            <button id="applyFilter" class="btn btn-apply">적용</button>
            <button id="clearFilter" class="btn btn-clear">초기화</button>
        </div>

        <table id="backupRadiationHistoryTable" class="display">
            <thead>
                <tr><th>측정 시간</th><th>방사선량 (μSv/h)</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>

    <script>
        $(document).ready(function() {
            const rawGenName = "{{ genName }}";
            const expl = "{{ expl }}";

            const table = $('#backupRadiationHistoryTable').DataTable({
                order: [[0, 'desc']], paging: true, pageLength: 10,
                language: { "emptyTable": "조회된 데이터가 없습니다." },
                columns: [{ data: 'time' }, { data: 'value', render: d => `${parseFloat(d).toFixed(3)} μSv/h` }]
            });

            $("#minDate, #maxDate").datepicker({
                dateFormat: 'yy-mm-dd', showOn: 'button',
                buttonText: "<img src='https://jqueryui.com/resources/demos/images/calendar.gif' alt='달력'>",
                changeMonth: true, changeYear: true
            });

            function loadData(min = '', max = '') {
                // ✅ 중요: 404를 방지하기 위해 물음표(?) 형식을 사용합니다.
                let apiUrl = `/api/nuclear_radiation/history?genName=${encodeURIComponent(rawGenName)}&expl=${encodeURIComponent(expl)}`;
                if (min) apiUrl += `&minDate=${min}`;
                if (max) apiUrl += `&maxDate=${max}`;

                $.ajax({
                    url: apiUrl,
                    method: 'GET',
                    success: function(data) {
                        console.log("받은 데이터 개수:", data.length);
                        table.clear();
                        if (data && data.length > 0) {
                            table.rows.add(data).draw();
                        } else {
                            table.draw();
                        }
                    }
                });
            }

            loadData();
            $('#applyFilter').click(() => loadData($('#minDate').val(), $('#maxDate').val()));
            $('#clearFilter').click(() => { $('#minDate').val(''); $('#maxDate').val(''); loadData(); });
        });
    </script>
</body>
</html>
