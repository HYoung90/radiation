<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ expl }}의 과거 방사선 데이터</title>
    <link rel="stylesheet" href="https://cdn.datatables.net/1.10.21/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/themes/smoothness/jquery-ui.min.css">
    <style>
        body {
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 20px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.2em;
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            font-size: 0.95em;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            margin-right: 8px;
            transition: background-color 0.3s ease, transform 0.2s ease, box-shadow 0.3s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            color: white;
            min-width: 120px;
            text-align: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.15);
        }

        .btn-back { background-color: #6c757d; }
        .btn-back:hover { background-color: #5a6268; }

        .btn-refresh { background-color: #007bff; }
        .btn-refresh:hover { background-color: #0056b3; }

        .date-filter-section {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 30px;
            padding: 20px;
            background-color: #f7f9fa;
            border-radius: 8px;
            box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        .date-filter-section label {
            font-weight: bold;
            color: #495057;
            white-space: nowrap;
        }

        .date-filter-section input[type="text"] {
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 5px;
            border: 1px solid #ced4da;
            width: 160px;
            box-sizing: border-box;
        }

        .ui-datepicker-trigger {
            margin-left: 5px;
            vertical-align: middle;
            cursor: pointer;
            border: none;
            background: none;
        }

        .ui-datepicker-trigger img {
            width: 24px;
            height: 24px;
            opacity: 0.7;
        }

        .btn-apply { background-color: #34495e; }
        .btn-apply:hover { background-color: #2c3e50; }

        .btn-clear { background-color: #e0a800; }
        .btn-clear:hover { background-color: #d39e00; }

        #backupRadiationHistoryTable {
            width: 100% !important;
            border-collapse: collapse;
            margin-top: 30px;
            background-color: #ffffff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        #backupRadiationHistoryTable thead th {
            background-color: #6c757d;
            color: white;
            padding: 15px;
            text-align: center;
            border-bottom: 2px solid #5a6268;
        }

        #backupRadiationHistoryTable tbody td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #e9ecef;
        }

        .dataTables_wrapper .dataTables_info,
        .dataTables_wrapper .dataTables_filter,
        .dataTables_wrapper .dataTables_length {
            display: none;
        }

        .dataTables_wrapper .dataTables_paginate {
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="display: flex; justify-content: flex-start; margin-bottom: 25px;">
            <a href="javascript:history.back()" class="btn btn-back">뒤로가기</a>
            <button id="refreshButton" class="btn btn-refresh">새로고침</button>
        </div>

        <h1>{{ expl }}의 과거 방사선 데이터</h1>

        <div class="date-filter-section">
            <label for="minDate">시작일: </label>
            <input type="text" id="minDate" name="minDate" readonly>
            <label for="maxDate">종료일: </label>
            <input type="text" id="maxDate" name="maxDate" readonly>
            <button id="applyFilter" class="btn btn-apply">적용</button>
            <button id="clearFilter" class="btn btn-clear">초기화</button>
        </div>

        <table id="backupRadiationHistoryTable" class="display">
            <thead>
                <tr>
                    <th>측정 시간</th>
                    <th>방사선량 (μSv/h)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
    <script src="https://cdn.datatables.net/1.10.21/js/jquery.dataTables.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>

    <script>
        $(document).ready(function() {
            // Flask에서 넘겨준 값 그대로 사용 (매핑 제거)
            var genName = "{{ genName }}";
            var expl = "{{ expl }}";

            var table = $('#backupRadiationHistoryTable').DataTable({
                order: [[0, 'desc']],
                searching: false,
                paging: true,
                info: false,
                lengthChange: false,
                pageLength: 10,
                language: {
                    "emptyTable": "데이터가 없습니다.",
                    "paginate": { "next": "다음", "previous": "이전" }
                },
                columns: [
                    { data: 'time' },
                    {
                        data: 'value',
                        render: function(data) {
                            return data !== null ? `${parseFloat(data).toFixed(3)} μSv/h` : "N/A";
                        }
                    }
                ]
            });

            $("#minDate").datepicker({
                dateFormat: 'yy-mm-dd',
                showOn: 'button',
                buttonText: "<img src='https://jqueryui.com/resources/demos/images/calendar.gif' alt='달력'>",
                changeMonth: true,
                changeYear: true,
                onSelect: function(selectedDate) {
                    $("#maxDate").datepicker("option", "minDate", selectedDate);
                }
            });

            $("#maxDate").datepicker({
                dateFormat: 'yy-mm-dd',
                showOn: 'button',
                buttonText: "<img src='https://jqueryui.com/resources/demos/images/calendar.gif' alt='달력'>",
                changeMonth: true,
                changeYear: true,
                onSelect: function(selectedDate) {
                    $("#minDate").datepicker("option", "maxDate", selectedDate);
                }
            });

            function loadBackupRadiationHistory(minDate = null, maxDate = null) {
                // genName 매핑 없이 원본(예: "고리 원자력발전소")을 그대로 인코딩하여 전송
                let apiUrl = `/api/nuclear_radiation/backup?genName=${encodeURIComponent(genName)}&expl=${encodeURIComponent(expl)}`;

                if (minDate) apiUrl += `&minDate=${encodeURIComponent(minDate)}`;
                if (maxDate) apiUrl += `&maxDate=${encodeURIComponent(maxDate)}`;

                $.ajax({
                    url: apiUrl,
                    method: 'GET',
                    success: function(data) {
                        table.clear();
                        if (data && data.length > 0) {
                            // 데이터를 DataTable 형식에 맞게 변환하여 추가
                            var rows = data.map(item => ({
                                time: item.time,
                                value: item.value
                            }));
                            table.rows.add(rows).draw();
                        } else {
                            table.draw();
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error("Error fetching backup data:", error);
                    }
                });
            }

            // 초기 데이터 로드
            loadBackupRadiationHistory();

            $('#applyFilter').on('click', function() {
                loadBackupRadiationHistory($('#minDate').val(), $('#maxDate').val());
            });

            $('#clearFilter').on('click', function() {
                $('#minDate').val('');
                $('#maxDate').val('');
                loadBackupRadiationHistory();
            });

            $('#refreshButton').on('click', function() {
                $('#minDate').val('');
                $('#maxDate').val('');
                loadBackupRadiationHistory();
            });
        });
    </script>
</body>
</html>
